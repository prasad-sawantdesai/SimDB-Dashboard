# CI pipeline orchestrated with Make targets and Docker build stages.
# Node version is defined in the Dockerfile.
# Buildx cache settings are provided through CACHE_FROM and CACHE_TO.
# Local and CI execution stay aligned through the same make commands.

name: CI/CD Pipeline

env:
  CACHE_FROM: type=gha,scope=simdb-dashboard
  CACHE_TO: type=gha,mode=max,scope=simdb-dashboard
  DOCKER_BUILDKIT: "1"

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Run lint (docker stage)
      run: make lint

  test:
    name: Test
    runs-on: ubuntu-22.04
    needs: lint
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Run tests (docker stage)
      run: |
        mkdir -p test-results
        make test 2>&1 | tee test-results/test.log

    - name: Upload test artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: test-results/
        retention-days: 7

  build:
    name: Build service image
    runs-on: ubuntu-22.04
    needs: test
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build service image (docker stage)
      run: make service

    - name: Extract frontend assets
      run: make dist

    - name: Export service image artifact
      run: |
        mkdir -p artifacts
        IMAGE_ID="$(docker compose images -q dashboard)"
        test -n "$IMAGE_ID"
        docker save -o artifacts/simdb-dashboard.tar "$IMAGE_ID"

    - name: Upload static assets artifact
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/
        retention-days: 7

    - name: Upload service image artifact
      uses: actions/upload-artifact@v4
      with:
        name: simdb-dashboard
        path: artifacts/simdb-dashboard.tar
        retention-days: 7
